[metadata]
name = clusterllm-local
version = 0.1.0
author = Hamady GACKOU
description = ClusterLLM-Local: reproducible clustering + LLM/embedding pipeline with Docker, Poetry/DVC/MLflow.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/gackouhamady/clusterllm-local
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
package_dir =
    = src

# Day2 target: Python 3.13 everywhere
python_requires = >=3.13

install_requires =
    numpy>=2.4.1,<3.0.0
    pandas>=2.3.3,<3.0.0
    scikit-learn>=1.8.0,<2.0.0
    transformers>=4.57.3,<5.0.0
    sentence-transformers>=5.2.0,<6.0.0
    hydra-core>=1.3.2,<2.0.0
    dvc>=3.66.1,<4.0.0
    mlflow>=3.8.1,<4.0.0
    datasets>=4.4.2,<5.0.0

include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    clusterllm-embed = clusterllm_local.cli:embed_app
    clusterllm-cluster = clusterllm_local.cli:cluster_app
    clusterllm-eval = clusterllm_local.cli:evaluate_app
    clusterllm-pipeline = clusterllm_local.cli:pipeline_app
    clusterllm-dvc-pull = clusterllm_local.cli:dvc_pull_app
    clusterllm-mlflow-ui = clusterllm_local.cli:mlflow_ui_app

[options.extras_require]
dev =
    pytest>=8.0.0
    flake8>=7.0.0
    hypothesis>=6.0.0
    sphinx>=8.0.0
    furo>=2024.0.0
    matplotlib>=3.10.0

[flake8]
max-line-length = 500
extend-ignore = E111,E116,E117,E122,E125,E126,E128,E131,E203,E222,E225,E226,E231,E251,E261,E262,E265,E266,E302,E303,E305,E401,E501,E701,E702,E713,E722,E741,F401,F403,F541,F811,F841,W291,W292,W293,W503
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist,
    docs/build
