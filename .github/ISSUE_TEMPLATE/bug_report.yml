name: Bug report (ClusterLLM-Local)
description: Report a bug or unexpected behavior in ClusterLLM-Local
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug 🙏  
        Please fill the form below so we can reproduce the issue **exactly** (same data + same env).

  - type: input
    id: version
    attributes:
      label: Project Version / Git commit
      description: Paste the version tag (e.g. v0.1.0) or the commit hash (recommended).
      placeholder: e.g. v0.1.0 or 3f2a1c9
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      description: Where does the bug happen?
      options:
        - Local (no Docker)
        - Docker (CPU)
        - Docker (GPU)
        - GitHub Actions CI
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 22.04, macOS 14, Windows 11...
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: e.g. 3.13.9
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker / Compose Version (if relevant)
      description: Output of `docker --version` and `docker compose version`
      placeholder: e.g. Docker 29.2.1 / Compose v5.0.2
    validations:
      required: false

  - type: textarea
    id: gpu
    attributes:
      label: GPU / CUDA Info (if relevant)
      description: Paste `nvidia-smi` output if the issue involves GPU.
      render: shell
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Example: "Running `poetry run python src/data/loader.py` crashes with ...  
        Expected: bank77 csv files are generated in data/raw/"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide the **exact** commands to reproduce the issue.
      value: |
        1. git clone ...
        2. cd clusterllm-local
        3. docker compose -f docker/docker-compose.yml build
        4. docker compose -f docker/docker-compose.yml run clusterllm
        5. poetry run ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config / Parameters Used (Hydra, scripts, env vars)
      description: Paste the config overrides or environment variables used.
      placeholder: |
        Example:
        - Command: poetry run python src/... +experiment=bank77
        - Env: HF_HOME=..., CUDA_VISIBLE_DEVICES=...
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Paste the full error trace/logs.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I can reproduce this issue consistently
          required: false
        - label: I ran local checks (optional) `./scripts/ci_local.sh` or `make check`
          required: false
        - label: I confirm this is not a duplicate issue
          required: false
