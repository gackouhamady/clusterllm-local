name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.13 sur runner
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Installe Poetry + deps depuis lock (recommandé)
      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Install dependencies (Poetry)
        run: |
          poetry --version
          poetry config virtualenvs.create true
          poetry install --no-interaction --no-ansi

      - name: Lint (flake8)
        run: |
          poetry run flake8 src tests

      - name: Tests (pytest)
        env:
          # éviter que HF essaie de télécharger pendant CI
          HF_HUB_DISABLE_TELEMETRY: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          poetry run pytest -q

  docker-build-smoke:
    runs-on: ubuntu-latest
    needs: quality-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build image Docker (CPU runner, pas de GPU)
      - name: Build Docker image (core)
        run: |
          docker build -f docker/Dockerfile -t clusterllm-local:core .

      # Smoke test minimal dans le container
      - name: Smoke test (container)
        run: |
          docker run --rm clusterllm-local:core bash -lc \
            "python --version && poetry --version && python -c 'import numpy, pandas; print(\"imports-ok\")'"

  docs:
    runs-on: ubuntu-latest
    needs: quality-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Install dependencies (Poetry)
        run: |
          poetry install --no-interaction --no-ansi

      - name: Build docs (Sphinx)
        run: |
          poetry run sphinx-apidoc -o docs/source/api src -f
          poetry run sphinx-build -b html docs/source docs/build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/build/html

  deploy-pages:
    needs: docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: sphinx-html
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
