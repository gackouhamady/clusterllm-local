[project]
name = "clusterllm-local"
version = "0.1.0"
description = "ClusterLLM core orchestration"
authors = [
  { name = "Hamady Gackou", email = "hamadygackou777@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
  "numpy>=2.4,<3.0",
  "pandas>=2.3,<3.0",
  "pydantic>=2.12,<3.0",
  "hydra-core>=1.3,<2.0",
  "dvc>=3.66,<4.0",
  "mlflow>=3.8,<4.0",
  "datasets>=4.4,<5.0",
  "rich>=14.0,<15.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
