[tool.poetry]
name = "clusterllm-local"
version = "0.1.0"
description = "ClusterLLM core orchestration"
authors = ["Hamady GACKOU <hamadygackou777@gmail.com>"]
readme = "README.md"
package-mode = false
packages = [{ include = "clusterllm", from = "src" }]

# IMPORTANT: Sources must be declared outside dependency tables
[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# Core scientific stack
numpy = "1.26.4"
pandas = ">=2.3,<3.0"
scipy = "*"
scikit-learn = "==1.2.0"
h5py = "3.10.0"

# HF / embeddings (paper-era compatibility)
transformers = "==4.30.2"
sentence-transformers = "==2.2.2"
datasets = "2.20.0"

# Utilities
requests = ">=2.26.0"
jsonlines = "*"
tqdm = "*"
rich = "*"

# Tracking / MLOps
hydra-core = ">=1.3,<2.0"
dvc = ">=3.0,<4.0"
mlflow = ">=2.0,<3.0"

# API client (temporary)
openai = ">=2.17.0,<3.0.0"
tokenizers = "==0.13.3"
pyarrow = "<20"
huggingface-hub = ">=0.23.0"


[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0,<8.0"
pytest = ">=8.0,<9.0"

[tool.poetry.group.docs.dependencies]
# Sphinx>=9 requires Python>=3.12, so keep it <8 for Python 3.11
sphinx = ">=7.0,<8.0"
furo = "*"
myst-parser = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-tabs = "*"
sphinxcontrib-mermaid = "*"

[build-system]
requires = ["poetry-core>=1.8.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
