[project]
name = "clusterllm-local"
version = "0.1.0"
description = "ClusterLLM core orchestration"
authors = [
  { name = "Hamady Gackou", email = "hamadygackou777@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
  "numpy>=2.4,<3.0",
  "pandas>=2.3,<3.0",
  "pydantic>=2.12,<3.0",
  "hydra-core>=1.3,<2.0",
  "dvc>=3.66,<4.0",
  "mlflow>=3.8,<4.0",
  "datasets>=4.4,<5.0",
  "rich>=14.0,<15.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "clusterllm-local"
version = "0.1.0"
description = ""
authors = ["Hamady Gackou <hamadygackou777@gmail.com>"]
readme = "README.md"
package-mode = false


[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "sphinx-copybutton (>=0.5.2,<0.6.0)",
    "sphinx-design (>=0.7.0,<0.8.0)",
    "sphinx-tabs (>=3.4.7,<4.0.0)",
    "sphinxcontrib-mermaid (>=2.0.0,<3.0.0)",
    "myst-parser (>=5.0.0,<6.0.0)"
]
