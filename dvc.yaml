stages:
  # ----------------------------
  # DATA PREP (NO METRICS HERE)
  # ----------------------------
  prepare_small:
    foreach: ${datasets.all}
    do:
      cmd: >-
        ALLOW_REMOTE_CODE=1
        bash scripts/run_prepare_data_only.sh
        ${item} small ${run.seed}
      deps:
      - scripts/run_prepare_data_only.sh
      - src/data/prepare_data.py
      params:
      - run.seed
      - datasets.all
      outs:
      - src/clusterllm/datasets/${item}/small.jsonl

  prepare_large:
    foreach: ${datasets.all}
    do:
      cmd: >-
        ALLOW_REMOTE_CODE=1
        bash scripts/run_prepare_data_only.sh
        ${item} large ${run.seed}
      deps:
      - scripts/run_prepare_data_only.sh
      - src/data/prepare_data.py
      params:
      - run.seed
      - datasets.all
      outs:
      - src/clusterllm/datasets/${item}/large.jsonl

  prepare_small_cont:
    foreach: ${datasets.all}
    do:
      cmd: >-
        mkdir -p src/clusterllm/datasets/${item}
        && cp -f src/clusterllm/datasets/${item}/small.jsonl src/clusterllm/datasets/${item}/small_cont.jsonl
      deps:
      - src/clusterllm/datasets/${item}/small.jsonl
      params:
      - datasets.all
      outs:
      - src/clusterllm/datasets/${item}/small_cont.jsonl

  prepare_large_cont:
    foreach: ${datasets.all}
    do:
      cmd: >-
        mkdir -p src/clusterllm/datasets/${item}
        && cp -f src/clusterllm/datasets/${item}/large.jsonl src/clusterllm/datasets/${item}/large_cont.jsonl
      deps:
      - src/clusterllm/datasets/${item}/large.jsonl
      params:
      - datasets.all
      outs:
      - src/clusterllm/datasets/${item}/large_cont.jsonl

  # ----------------------------
  # PIPELINE (METRICS ONLY HERE)
  # ----------------------------
  full_pipeline_2llms:
    cmd: >-
      bash scripts/run_full_pipeline_one_dataset_two_llms.sh
      ${run.dataset} ${run.scale} ${run.llm_triplet} ${run.llm_pairs} ${run.seed}
    deps:
    - scripts/run_full_pipeline_one_dataset_two_llms.sh
    - scripts/patch_get_embedding_safetensors.py
    - src/clusterllm/datasets/${run.dataset}/${run.scale}.jsonl
    - src/clusterllm/perspective/predict_triplet/triplet_sampling.py
    - src/clusterllm/perspective/predict_triplet/predict.py
    - src/clusterllm/perspective/finetuning/convert_triplet.py
    - src/clusterllm/perspective/finetuning/convert_triplet_self.py
    - src/clusterllm/perspective/finetuning/finetune.py
    - src/clusterllm/perspective/finetuning/get_embedding.py
    - src/clusterllm/perspective/finetuning/prompts.json
    - src/clusterllm/granularity/sample_pairs.py
    - src/clusterllm/granularity/sample_pairs_for_prompt.py
    - src/clusterllm/granularity/predict_pairs.py
    - src/clusterllm/granularity/predict_num_clusters.py
    params:
    - run.dataset
    - run.scale
    - run.llm_triplet
    - run.llm_pairs
    - run.seed
    outs:
      # Track embeddings (requested) as pipeline outputs
    - src/clusterllm/datasets/${run.dataset}/${run.scale}_embeds.hdf5
    - src/clusterllm/datasets/${run.dataset}/${run.scale}_embeds_ft.hdf5

      # Other run artifacts (not cached)
    - runs/perspective:
        cache: false
    - runs/granularity:
        cache: false
    metrics:
      # 1) baseline embedding metrics (JSON in datasets/)
    - src/clusterllm/datasets/${run.dataset}/${run.scale}_embeds_metrics.json
      # 2) finetuned embedding metrics (JSON in datasets/)
    - src/clusterllm/datasets/${run.dataset}/${run.scale}_embeds_ft_metrics.json
      # 3) final summary (JSON in runs/)
    - runs/summary/full_pipeline_2llms/${run.dataset}/${run.scale}/summary.json:
        cache: false

  # ============================================================
  # CONTRIBUTION / CONT PIPELINE (METRICS ONLY HERE)
  # ============================================================
  full_pipeline_2llms_cont:
    cmd: >-
      bash scripts/run_full_pipeline_one_dataset_two_llms_cont.sh
      ${run2llms.dataset} ${run2llms.scale} ${run2llms.llm_triplet} ${run2llms.llm_pairs}
      ${run2llms.seed}
    deps:
    - scripts/run_full_pipeline_one_dataset_two_llms_cont.sh
    - scripts/patch_get_embedding_safetensors.py
    - src/clusterllm/datasets/${run2llms.dataset}/${run2llms.scale}_cont.jsonl
    - src/clusterllm/perspective/finetuning/get_embedding_cont.py
    - src/clusterllm/perspective/predict_triplet/triplet_sampling_cont.py
    - src/clusterllm/perspective/predict_triplet/predict_cont.py
    - src/clusterllm/perspective/finetuning/convert_triplet_cont.py
    - src/clusterllm/perspective/finetuning/convert_triplet_self_cont.py
    - src/clusterllm/perspective/finetuning/finetune_cont.py
    - src/clusterllm/perspective/finetuning/prompts.json
    - src/clusterllm/granularity/sample_pairs_cont.py
    - src/clusterllm/granularity/sample_pairs_for_prompt_cont.py
    - src/clusterllm/granularity/predict_pairs_cont.py
    - src/clusterllm/granularity/predict_num_clusters_cont.py
    params:
    - run2llms.dataset
    - run2llms.scale
    - run2llms.llm_triplet
    - run2llms.llm_pairs
    - run2llms.seed
    outs:
      # Track embeddings (already stable paths)
    - src/clusterllm/datasets/${run2llms.dataset}/${run2llms.scale}_embeds_contrib_cont.hdf5
    - src/clusterllm/datasets/${run2llms.dataset}/${run2llms.scale}_embeds_ft_contrib_cont.hdf5

      # Canonical artifacts (stable)
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/pred_triplets_cont.json
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/train_cont.json
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/cluster_results_cont.json
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/prompt_cont.json
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/pred_pairs_cont.json
    - runs_cont/artifacts_contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/num_clusters_cont.txt
    metrics:
      # 1) baseline embedding metrics (JSON in datasets/)
    - src/clusterllm/datasets/${run2llms.dataset}/${run2llms.scale}_embeds_contrib_cont_metrics.json
      # 2) finetuned embedding metrics (JSON in datasets/)
    - src/clusterllm/datasets/${run2llms.dataset}/${run2llms.scale}_embeds_ft_contrib_cont_metrics.json
      # 3) final summary (JSON in runs_cont/)
    - runs_cont/summary/contrib_2llms_cont/${run2llms.dataset}/${run2llms.scale}/summary_cont.json:
        cache: false
