services:
  clusterllm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clusterllm-local:core
    container_name: clusterllm-local
    working_dir: /workspace
    volumes:
      - ../:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/dvc:/root/.cache/dvc
    stdin_open: true
    tty: true
    gpus: all
